<footer class="pt-60 pb-40 lg:py-40 px-20 lg:px-40 lg:max-w-inner w-full mx-auto mt-60 lg:mt-120 text-sm xl:text-md">

  <div class="lg:flex lg:justify-between w-full">

    {{ partial:components/contact }}

    {{ if contact:imprint }}
      <div class="text-center lg:text-left mb-15 lg:mb-0 [&_a]:underline [&_a]:underline-offset-2 [&_a]:hover:no-underline">
        {{ contact:imprint }}
      </div>
    {{ /if }}

    {{ if contact:copyright }}
      <div class="text-center lg:text-left">
        <div>
          &copy; {{ 'now' | format('Y') }}  {{ contact:copyright }}
        </div>
        <div>
          <a 
            href="/datenschutzerklaerung"
            class="no-underline underline-offset-2 hover:underline"
            aria-label="Datenschutzerklärung">
            Datenschutzerklärung
          </a>
        </div>
      </div>
    {{ /if }}

  </div>

</footer>
