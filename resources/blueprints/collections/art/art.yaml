title: Art
tabs:
  teaser:
    display: Teaser
    sections:
      -
        display: Teaser
        fields:
          -
            handle: image
            field:
              container: assets
              max_files: 1
              min_files: 1
              type: assets
              display: Image
              validate:
                - required
          -
            import: text_teaser
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Titel
              validate:
                - required
          -
            import: text_detail
          -
            handle: blocks
            field:
              type: replicator
              display: 'Content Blocks'
              collapse: true
              sets:
                main:
                  display: Main
                  sets:
                    image:
                      display: 'Single Image'
                      instructions: 'Add a single image'
                      icon: insert-image
                      fields:
                        -
                          import: image
  settings:
    display: Settings
    sections:
      -
        display: Preisliste
        fields:
          -
            handle: pricelist
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Preisliste (PDF)'
              instructions: 'Optional. Ist eine Preisliste hinterlegt, kann sie unter der Ausstellungs-URL + "/pl.pdf" aufgerufen werden.'
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
