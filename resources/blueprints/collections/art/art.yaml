title: Art
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: type
            field:
              type: text
              display: Typ
          -
            handle: title
            field:
              type: text
              required: true
              display: Titel
              validate:
                - required
          -
            import: editor
          -
            handle: blocks
            field:
              type: replicator
              display: 'Content Blocks'
              collapse: true
              sets:
                main:
                  display: Main
                  sets:
                    image:
                      display: 'Single Image'
                      instructions: 'Add a single image'
                      icon: insert-image
                      fields:
                        -
                          import: image
  teaser:
    display: Teaser
    sections:
      -
        display: Teaser
        fields:
          -
            import: image
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
