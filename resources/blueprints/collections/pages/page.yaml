title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: blocks
            field:
              type: replicator
              display: 'Content Blocks'
              collapse: true
              sets:
                main:
                  display: Main
                  sets:
                    grid:
                      display: Grid
                      instructions: 'Add a two-column grid'
                      icon: layout-two-columns
                      fields:
                        -
                          import: grid
                    art_teaser:
                      display: 'Art Teaser'
                      instructions: 'Add a teaser linking to an art entry'
                      icon: text-formatting-image-top
                      fields:
                        -
                          import: art_teaser
                    page_teaser:
                      display: 'Page Teaser'
                      instructions: 'Add a teaser with image, title and text'
                      icon: text-formatting-image-top
                      fields:
                        -
                          import: page_teaser
                    portrait:
                      display: About
                      instructions: 'Add a portrait block with image and quote'
                      icon: hero-image-above-text
                      fields:
                        -
                          import: portrait
                    title_text:
                      display: 'Title, Text'
                      instructions: 'Title, Text Element'
                      icon: text-formatting-initial-letter
                      fields:
                        -
                          import: title_text
                    privacy:
                      display: Privacy
                      instructions: 'Privacy / Datenschutz content'
                      icon: shield
                      fields:
                        -
                          import: privacy
  settings:
    display: Settings
    sections:
      -
        display: Template
        fields:
          -
            handle: template
            field:
              type: template
              display: Template
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
