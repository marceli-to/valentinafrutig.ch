title: Image
fields:
  -
    handle: image
    field:
      container: assets
      max_files: 1
      min_files: 1
      type: assets
      display: Image
      validate:
        - required
  -
    handle: toggle_caption
    field:
      type: toggle
      display: 'Bildlegende?'
  -
    handle: caption
    field:
      buttons:
        - bold
        - italic
        - removeformat
        - anchor
      toolbar_mode: floating
      container: assets
      remove_empty_nodes: true
      type: bard
      display: Legende
      if:
        toggle_caption: 'equals true'
