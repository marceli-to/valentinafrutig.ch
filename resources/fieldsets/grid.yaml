title: Grid
fields:
  -
    handle: block_left
    field:
      type: replicator
      display: 'Column (Left)'
      width: 50
      collapse: true
      sets:
        main:
          display: Main
          sets:
            image:
              display: 'Single Image'
              instructions: 'Add a single image'
              icon: insert-image
              fields:
                -
                  import: image
            quote:
              display: Quote
              instructions: 'Add a quote'
              icon: quote
              fields:
                -
                  import: quote
            title_text:
              display: 'Title, Text'
              instructions: 'Add a text element with a title'
              icon: text-formatting-image-top
              fields:
                -
                  import: title_text
  -
    handle: block_right
    field:
      type: replicator
      display: 'Column (Right)'
      width: 50
      collapse: true
      sets:
        main:
          display: Main
          sets:
            image:
              display: 'Single Image'
              instructions: 'Add a single image'
              icon: insert-image
              fields:
                -
                  import: image
            quote:
              display: Quote
              instructions: 'Add a quote'
              icon: quote
              fields:
                -
                  import: quote
            title_text:
              display: 'Title, Text'
              instructions: 'Add a text element with a title'
              icon: text-formatting-image-top
              fields:
                -
                  import: title_text
