title: Grid
fields:
  -
    handle: blocks
    field:
      type: replicator
      display: Blocks
      instructions: 'Order blocks as they should appear on mobile (top to bottom). Pick a column for each block to control desktop placement.'
      collapse: true
      sets:
        main:
          display: Main
          sets:
            image:
              display: 'Single Image'
              instructions: 'Add a single image'
              icon: insert-image
              fields:
                -
                  import: grid_column
                -
                  import: image
            quote:
              display: Quote
              instructions: 'Add a quote'
              icon: quote
              fields:
                -
                  import: grid_column
                -
                  import: quote
            title_text:
              display: 'Title, Text'
              instructions: 'Add a text element with a title'
              icon: text-formatting-initial-letter
              fields:
                -
                  import: grid_column
                -
                  import: title_text
            art_teaser:
              display: 'Art Teaser'
              instructions: 'Add a teaser linking to an art entry'
              icon: text-formatting-image-top
              fields:
                -
                  import: grid_column
                -
                  import: art_teaser
            page_teaser:
              display: 'Page Teaser'
              instructions: 'Add a teaser with image, title and text'
              icon: text-formatting-image-top
              fields:
                -
                  import: grid_column
                -
                  import: page_teaser
            portrait:
              display: Portrait
              instructions: 'Add a portrait block with image and quote'
              icon: user
              fields:
                -
                  import: grid_column
                -
                  import: portrait
