title: 'Text Detail'
fields:
  -
    handle: text_detail
    field:
      type: bard
      display: Text
      buttons:
        - h2
        - h3
        - bold
        - unorderedlist
        - removeformat
        - anchor
      toolbar_mode: floating
      link_collections:
        - pages
      container: assets
      remove_empty_nodes: trim
      collapse: true
      sets:
        main:
          display: Main
          sets:
            spacer:
              display: Spacer
              instructions: 'Add an empty line'
              icon: fieldtype-spacer
              fields: {  }
